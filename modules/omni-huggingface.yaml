name: omni-huggingface
description: >
  Fetches datasets or model weights into the shared Hugging Face cache, then
  materialises them at the paths the benchmark declares. Writes a manifest
  instead of copying when the declared output ends in .json, so heavy weights
  are not duplicated per node.
